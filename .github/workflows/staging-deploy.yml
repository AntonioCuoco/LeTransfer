# Deploy del frontend di STAGING (novren-staging.pages.dev).
#
# Si attiva con un tag `staging-*`, mai con `v*`: quelli sono della produzione
# (reproducible-build.yml) e i due prefissi non possono sovrapporsi.
#
#   git tag staging-2026-11-03-1 && git push origin staging-2026-11-03-1
#
# Differenze rispetto alla produzione, volute:
#   - `npm run build:staging` (mode staging): carica .env.staging e fa generare a
#     vite.config.ts la CSP di staging (API di staging, captcha sulla stessa origine).
#     Con il build di produzione staging chiamerebbe api.novren.net.
#   - Nessuna release né manifesto degli hash: la verificabilità pubblica riguarda
#     solo ciò che serve novren.net.

name: Deploy staging

on:
  push:
    tags: ['staging-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      VITE_BUILD_COMMIT: ${{ github.sha }}
    defaults:
      run:
        working-directory: vue-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: vue-app/.nvmrc
          cache: npm
          cache-dependency-path: vue-app/package-lock.json

      - name: Installa le dipendenze dal lockfile
        run: npm ci

      - name: Test del nucleo crittografico
        run: npm test

      # Include vue-tsc -b. Se il plugin della CSP non trova il testo da sostituire,
      # il build fallisce qui invece di pubblicare una CSP che punta alla produzione.
      - name: Build (mode staging)
        run: npm run build:staging

      - name: Controlla la CSP generata
        run: |
          grep -q 'https://novren-staging.fly.dev' dist/_headers || { echo "::error::connect-src senza l'API di staging"; exit 1; }
          if grep -q 'https://api.novren.net' dist/_headers; then echo "::error::la CSP di staging punta ancora alla produzione"; exit 1; fi

      # Il ramo di produzione del progetto Pages decide se il deploy finisce su
      # novren-staging.pages.dev o su un URL di anteprima: lo si legge dal progetto
      # invece di indovinarlo.
      - name: Legge il ramo di produzione del progetto Pages
        id: progetto
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          risposta=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/novren-staging") \
            || { echo "::error::progetto Pages novren-staging non leggibile con questo token"; exit 1; }
          ramo=$(echo "$risposta" | jq -r '.result.production_branch')
          [ -n "$ramo" ] && [ "$ramo" != "null" ] || { echo "::error::production_branch assente"; exit 1; }
          echo "Ramo di produzione di novren-staging: $ramo"
          echo "ramo=$ramo" >> "$GITHUB_OUTPUT"

      - name: Deploy su Cloudflare Pages (novren-staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: vue-app
          command: pages deploy dist --project-name=novren-staging --branch=${{ steps.progetto.outputs.ramo }}
