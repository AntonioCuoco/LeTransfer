# Build riproducibile del client (roadmap F2 — "come lo verifichi").
#
# PERCHÉ ESISTE
# La cifratura di LeTransfer avviene nel codice che serviamo noi. È il limite
# strutturale di ogni E2E dentro un browser: se la nostra distribuzione venisse
# manomessa, l'utente non avrebbe modo di accorgersene. Non possiamo eliminare quel
# limite, ma possiamo renderlo VERIFICABILE DA TERZI: chiunque ricostruisce dal tag
# e confronta gli hash con quelli pubblicati qui.
#
# ⚠️ Onestà su cosa NON risolve: il browser non sa confrontare l'hash del bundle che
# sta eseguendo. Questo rende una manomissione *rilevabile da un ricercatore*, non
# *impedita al singolo utente*. È comunque la cosa più forte disponibile oggi.

name: Build riproducibile

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['vue-app/**', '.github/workflows/reproducible-build.yml']

permissions:
  contents: write      # serve a creare la release con SHA256SUMS.txt
  id-token: write      # attestazione di provenienza
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # A livello di JOB, non di step. Il controllo di determinismo lancia una seconda
    # build da un altro step: con una env di step le due build vedrebbero valori
    # diversi e il confronto fallirebbe per un motivo che non c'entra nulla con la
    # riproducibilità. Serve alla pagina /sicurezza per dire QUALE build stai usando.
    env:
      VITE_BUILD_COMMIT: ${{ github.sha }}
    defaults:
      run:
        working-directory: vue-app

    steps:
      - uses: actions/checkout@v4

      # Toolchain fissata: la versione di Node fa parte dell'input della build.
      - uses: actions/setup-node@v4
        with:
          node-version-file: vue-app/.nvmrc
          cache: npm
          cache-dependency-path: vue-app/package-lock.json

      # `npm ci` (mai `npm install`): installa ESATTAMENTE il lockfile.
      - name: Installa le dipendenze dal lockfile
        run: npm ci

      - name: Type-check
        run: npx vue-tsc --noEmit -p tsconfig.app.json

      # I test del nucleo crittografico girano PRIMA della build: un difetto lì non
      # produce una schermata sbagliata, produce file che non si riaprono.
      - name: Test del nucleo crittografico
        run: npm test

      # SOURCE_DATE_EPOCH: convenzione per build riproducibili — fissa il "tempo"
      # della build al commit, così eventuali timestamp non cambiano gli artefatti.
      - name: Build
        run: npm run build
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
          NODE_ENV: production

      # Doppia build dallo stesso sorgente: se gli hash divergono, la build NON è
      # riproducibile e va sistemata prima di pubblicare la promessa agli utenti.
      - name: Verifica determinismo (ricostruisce e confronta)
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build-1.txt
          rm -rf dist
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build-2.txt
          if ! diff -u /tmp/build-1.txt /tmp/build-2.txt; then
            echo "::error::Build NON deterministica: due build dallo stesso sorgente producono file diversi."
            exit 1
          fi
          echo "Build deterministica ✓"

      - name: Genera il manifesto degli hash
        run: |
          {
            echo "# Novren — manifesto della build"
            echo ""
            echo "commit:   ${{ github.sha }}"
            echo "ref:      ${{ github.ref_name }}"
            echo "node:     $(node -v)"
            echo "npm:      $(npm -v)"
            echo "runner:   ubuntu-24.04"
            echo ""
            echo "## SHA-256 degli asset"
            echo ""
            # Subshell: senza le parentesi il `cd` sopravvive alla graffa e il resto
            # dello script gira dentro dist/ — il `cat` qui sotto cercherebbe il file
            # nella cartella sbagliata e fallirebbe, pur avendolo scritto bene.
            ( cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum )
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Attestazione firmata da GitHub: lega gli artefatti al commit e al workflow.
      - name: Attesta la provenienza
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: vue-app/dist/**

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ github.sha }}
          path: |
            vue-app/dist
            vue-app/SHA256SUMS.txt

      # ── Pubblicazione ────────────────────────────────────────────────────────
      #
      # 🚨 SOLO SUI TAG. Il workflow gira anche sulle pull request, dove deve
      #    costruire e verificare ma NON pubblicare: senza questa condizione ogni PR
      #    aperta finirebbe in produzione.
      #
      # L'ordine dei due step che seguono non è casuale: si pubblica **la stessa
      # cartella `dist/` di cui è appena stato calcolato il manifesto**. È questo che
      # rende vera la promessa di verificabilità — fra ciò che dichiariamo e ciò che
      # serviamo non si inserisce nessun passaggio, nessuna ricostruzione, nessun
      # portatile. Deployare a mano con `wrangler pages deploy` riaprirebbe quel buco:
      # pubblicheresti byte di cui nessuno ha l'hash.

      - name: Deploy su Cloudflare Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: vue-app
          # `--branch` decide produzione vs preview: senza, da un tag wrangler non
          # saprebbe quale dei due, e finirebbe su un URL di anteprima.
          command: pages deploy dist --project-name=novren --branch=master

      # Il manifesto va dove qualcuno può trovarlo. Un file dentro un artifact di CI
      # è visibile solo a chi ha accesso al repo; una release è pubblica, ed è quella
      # che la pagina /sicurezza indica a chi vuole verificare.
      - name: Pubblica la release con il manifesto
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vue-app/SHA256SUMS.txt
          body: |
            Build verificabile del client Novren.

            - commit: `${{ github.sha }}`
            - runner: `ubuntu-24.04`, Node da `vue-app/.nvmrc`

            `SHA256SUMS.txt` elenca l'impronta SHA-256 di ogni file pubblicato su
            https://novren.net — gli stessi byte che questa pipeline ha costruito e
            deployato, senza passaggi intermedi.

            **Per verificare**, su Linux x64 con la versione di Node dichiarata in
            `vue-app/.nvmrc`, partendo da un clone pulito:

            ```
            git clone https://github.com/AntonioCuoco/LeTransfer && cd LeTransfer
            git checkout ${{ github.ref_name }}
            cd vue-app && npm ci
            VITE_BUILD_COMMIT=${{ github.sha }} NODE_ENV=production npm run build
            cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            ```

            L'elenco deve combaciare con quello allegato. Se non combacia, i byte
            serviti non sono quelli di questo sorgente — ed è esattamente ciò che
            questo meccanismo esiste per rendere visibile.

            ⚠️ **`VITE_BUILD_COMMIT` non è facoltativo.** Il commit viene incorporato
            nel bundle e il suo hash si propaga ai chunk che lo importano: ometterlo
            cambia l'impronta di circa metà dei file, e la verifica fallisce su un
            artefatto perfettamente legittimo. Stessa cosa per la versione di Node.
            Non creare un file `.env`: `.env.production` è versionato e basta da solo.
