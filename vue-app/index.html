<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nome pubblico del prodotto: Novren. Lato codice l'identificatore resta
         "LeTransfer" (chiavi di storage, preset del tema, nome del repo) finché non
         c'è una migrazione vera: rinominare le chiavi `letransfer_*` senza migrare i
         dati sloggherebbe tutti e farebbe perdere le chiavi salvate nel browser. -->
    <title>Novren</title>

    <!--
      Font self-hosted (roadmap F0.1). Precarichiamo SOLO i due che si vedono sopra
      la piega della facciata: il corpo (Inter) e il titolo (Inter Tight). Il mono
      arriva col foglio di stile — nel frattempo `swap` mostra il monospace di sistema,
      che per un'etichetta tecnica è una sostituzione onesta.
      `crossorigin` è obbligatorio: i font in CSS si scaricano sempre in modalità CORS
      anonima e senza l'attributo il browser scaricherebbe lo stesso file due volte.
      Vite riscrive questi href sull'asset con hash in fase di build.
    -->
    <link
      rel="preload"
      href="/src/assets/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/inter-tight-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
