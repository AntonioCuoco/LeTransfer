<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Verifica anti-bot · Novren</title>
<!--
  Stanza isolata per Cloudflare Turnstile.

  PERCHÉ ESISTE QUESTO FILE
  Lo script di Turnstile gira nella pagina che lo ospita, con pieno accesso a DOM e
  memoria. Caricarlo nella pagina dell'invio significherebbe farlo convivere con la
  generazione della chiave AES: un codice di terze parti nella stanza dove nasce il
  segreto. Qui invece vive su un'ORIGINE DIVERSA (vedi VITE_CAPTCHA_ORIGIN): il
  cross-origin gli nega l'accesso al documento genitore, e la pagina che cifra può
  restare su una CSP `script-src 'self'`.

  ⚠️ Nessun attributo `sandbox` sull'iframe genitore: l'isolamento lo dà già
  l'origine diversa, mentre `sandbox` renderebbe l'origine opaca rompendo l'accesso
  allo storage di cui Turnstile ha bisogno.

  ⚠️ Deve restare MINIMA: nessuna dipendenza, nessun dato, nessun segreto.
  L'unica cosa che esce da qui è un token monouso, verso un'origine in lista bianca.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #widget { display: flex; justify-content: center; }
  #fallback {
    font: 12px/1.4 ui-monospace, Menlo, monospace;
    color: #b3352f;
    text-align: center;
    padding: 8px;
  }
</style>
</head>
<body>
<div id="widget"></div>
<div id="fallback" hidden>Verifica anti-bot non disponibile.</div>

<!-- Esterno e non inline: la CSP di /captcha non ammette script inline. Vedi captcha.js. -->
<script src="/captcha.js"></script>
</body>
</html>
